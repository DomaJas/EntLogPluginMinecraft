# Сколько дней логов держать в памяти для команды /el check (файлы на диске не удаляются)
memory-days: 14

# Сколько записей показывать на одной странице /el check
check-page-size: 5

# Максимальный радиус для /el near
max-near-radius: 200

# Как часто (в минутах) чистить старые записи из памяти
prune-interval-minutes: 60

# Режим телепортации по клику на координаты в логах:
#   both            - прямая телепортация только в спектаторе, иначе /tp команда в чат
#   alwaysTeleport  - клик всегда телепортирует напрямую, в любом режиме
#   teleportConfirm - клик всегда только подставляет /tp в чат
teleportMode: alwaysTeleport